<title>29 Ekim Cumhuriyet Bayramı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700&display=swap">
<style>
  /* Night-celebration identity: flag red on near-black blue, Anton poster numerals, Manrope text */
  :root {
    --bg: #080a12;
    --ink: #f4f2ed;
    --red: #e30a17;
    --red-bright: #ff3b4a;
    --gold: #e8c989;
    --muted: #8f96ad;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas#scene:focus-visible { outline: 2px solid var(--red-bright); outline-offset: -2px; }

  .frame {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(22px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px))
             max(22px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
    background: radial-gradient(120% 90% at 50% 8%, rgba(4,5,10,0) 55%, rgba(4,5,10,0.45) 100%);
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow .star { color: var(--red-bright); }
  .year {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--red-bright);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .musicbtn {
    pointer-events: auto;
    appearance: none;
    -webkit-appearance: none;
    background: rgba(8,10,18,0.4);
    border: 1px solid rgba(232,201,137,0.45);
    color: var(--gold);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .musicdock { display: flex; gap: 6px; align-items: center; }
  .musicbtn.skip { padding: 8px 11px; }
  .musicbtn[aria-pressed="true"] {
    background: rgba(232,201,137,0.14);
    border-color: var(--gold);
  }
  .musicbtn:focus-visible { outline: 2px solid var(--red-bright); outline-offset: 2px; }
  .titleblock { max-width: 30ch; }
  h1 {
    margin: 0;
    font-family: "Anton", "Arial Narrow", sans-serif;
    font-weight: 400;
    font-size: clamp(64px, 17vw, 168px);
    line-height: 0.94;
    letter-spacing: 0.015em;
    text-transform: uppercase;
    color: var(--ink);
    text-wrap: balance;
  }
  h1 .red { color: var(--red-bright); }
  .subtitle {
    margin: 10px 0 0;
    font-size: clamp(17px, 4.4vw, 24px);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .meta {
    margin: 6px 0 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .hint {
    align-self: flex-end;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fallback {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 24px;
    background: var(--bg);
  }
  .fallback .detail { color: var(--muted); font-size: 13px; margin-top: 8px; max-width: 46ch; }
  .fallback[hidden] { display: none; }
  .quotebox {
    position: fixed;
    left: 50%;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(14px);
    max-width: min(72ch, 86vw);
    z-index: 2;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .quotebox.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .quotebox .q {
    font-size: clamp(19px, 3.4vw, 27px);
    font-weight: 700;
    line-height: 1.35;
    text-shadow: 0 2px 18px rgba(4,5,10,0.85);
  }
  .quotebox .q span {
    display: inline-block;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
    animation-delay: var(--d, 0s);
  }
  .quotebox .m {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .eggcount { color: var(--gold); margin-left: 14px; letter-spacing: 0.14em; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .frame { background: none; }
    .quotebox { transition: none; transform: translateX(-50%); }
    .quotebox .q span { animation: none; opacity: 1; transform: none; }
  }
</style>

<script>
(function () {
  "use strict";
  function showFatal(msg, detail) {
    document.getElementById("fallback").hidden = false;
    document.getElementById("fallback-msg").textContent = msg;
    document.getElementById("fallback-detail").textContent = detail || "";
  }
  window.addEventListener("error", function (ev) {
    if (document.getElementById("fallback").hidden) {
      showFatal("Sahne çalışırken hata oluştu.", ev.message);
    }
  });

  var canvas = document.getElementById("scene");
  if (typeof THREE === "undefined") {
    showFatal("Three.js kitaplığı yüklenemedi.", "CDN erişimi olmadan sahne kurulumu yapılamaz. Bağlantıyı denetleyip sayfayı yenile.");
    return;
  }
  var probe = document.createElement("canvas");
  var gl = probe.getContext("webgl2") || probe.getContext("webgl") || probe.getContext("experimental-webgl");
  if (!gl) {
    showFatal("Tarayıcın WebGL bağlamı oluşturamadı.", "Tarayıcının donanım hızlandırma ayarını açıp sayfayı yenile.");
    return;
  }
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    showFatal("WebGL başlatılamadı.", String(e && e.message || e));
    return;
  }
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x080a12, 1);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x080a12, 16, 42);

  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0.4, 8.2);

  // ---- lights ----
  scene.add(new THREE.AmbientLight(0x36405e, 0.9));
  var key = new THREE.DirectionalLight(0xfff4e0, 0.85);
  key.position.set(4, 6, 7);
  scene.add(key);
  var rim = new THREE.PointLight(0xe30a17, 1.6, 30);
  rim.position.set(-5, -1, 3);
  scene.add(rim);

  // ---- starfield ----
  var starGeo = new THREE.BufferGeometry();
  var starCount = 900;
  var starPos = new Float32Array(starCount * 3);
  for (var i = 0; i < starCount; i++) {
    var r = 18 + Math.random() * 18;
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(2 * Math.random() - 1);
    starPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    starPos[i * 3 + 1] = r * Math.cos(ph) * 0.7;
    starPos[i * 3 + 2] = -6 - Math.random() * 18;
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0xc9d2ea, size: 0.055, transparent: true, opacity: 0.75,
    depthWrite: false
  }));
  scene.add(stars);

  // ---- soft round particle sprite ----
  function dotTexture() {
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(0.35, "rgba(255,255,255,0.85)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  var sprite = dotTexture();

  // ---- Turkish flag, official construction (all measures in hoist G, 2:3 fly) ----
  function flagTexture() {
    var W = 1536, H = 1024, G = H;
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var g = c.getContext("2d");
    var RED = "#e30a17", WHITE = "#fbf9f2";
    g.fillStyle = RED; g.fillRect(0, 0, W, H);
    // crescent: outer circle B = G/2 centered A = G/2 from hoist; inner cutter
    // D = 2G/5 offset C = G/16 toward the fly
    var cx = 0.5 * G, cy = H / 2;
    g.fillStyle = WHITE;
    g.beginPath(); g.arc(cx, cy, 0.25 * G, 0, Math.PI * 2); g.fill();
    g.fillStyle = RED;
    g.beginPath(); g.arc(cx + 0.0625 * G, cy, 0.2 * G, 0, Math.PI * 2); g.fill();
    // star: pentagram in circle F = G/4, center E = G/3 beyond the inner circle, one tip toward the crescent
    var sx = cx + 0.0625 * G + G / 3, sr = 0.125 * G, ir = sr * 0.382;
    g.fillStyle = WHITE;
    g.beginPath();
    for (var k = 0; k < 10; k++) {
      var rad = k % 2 ? ir : sr;
      var a = Math.PI + k * Math.PI / 5;
      var x = sx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      if (k) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.closePath();
    g.fill();
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.anisotropy = 4;
    return tex;
  }
  var flagTex = flagTexture();
  var flagGeo = new THREE.PlaneGeometry(4.5, 3, 32, 20);
  var flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({
    map: flagTex, side: THREE.DoubleSide, roughness: 0.85, metalness: 0.05
  }));
  flag.position.set(-0.9, 0.85, 0);
  flag.rotation.y = -0.16;
  scene.add(flag);
  var flagBase = flagGeo.attributes.position.array.slice();

  var pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.06, 6.6, 12),
    new THREE.MeshStandardMaterial({ color: 0x3a3f4c, metalness: 0.6, roughness: 0.35 })
  );
  pole.position.set(-3.24, -0.85, 0);
  scene.add(pole);
  var finial = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xe8c989, metalness: 0.8, roughness: 0.25 })
  );
  finial.position.set(-3.24, 2.52, 0);

  // ---- fireworks ----
  var bursts = [];
  var rockets = [];
  var PALETTE = [0xff3b4a, 0xff3b4a, 0xffffff, 0xffffff, 0xffd27a];

  function explode(x, y, z, palette) {
    var base = new THREE.Color((palette || PALETTE)[(Math.random() * (palette || PALETTE).length) | 0]);
    var n = 130 + ((Math.random() * 50) | 0);
    var pos = new Float32Array(n * 3);
    var col = new Float32Array(n * 3);
    var vel = [];
    for (var i = 0; i < n; i++) {
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      var u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2;
      var s = Math.sqrt(1 - u * u) * (1.6 + Math.random() * 1.7);
      vel.push(new THREE.Vector3(s * Math.cos(a), u * 1.4 + 0.3, s * Math.sin(a) * 0.6));
      var c = base.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.55);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({
      size: 0.14, map: sprite, vertexColors: true, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    var pts = new THREE.Points(geo, mat);
    scene.add(pts);
    bursts.push({ pts: pts, vel: vel, life: 0, ttl: 1.9 + Math.random() * 0.5 });

    if (bursts.length > 11) {
      var old = bursts.shift();
      scene.remove(old.pts);
      old.pts.geometry.dispose();
      old.pts.material.dispose();
    }
  }

  function launch(tx, ty) {
    if (tx === undefined) {
      tx = -3.6 + Math.random() * 7.2;
      ty = 1.4 + Math.random() * 2.2;
    }
    var m = new THREE.Mesh(
      new THREE.SphereGeometry(0.035, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff6da })
    );
    m.position.set(tx + (Math.random() - 0.5) * 0.8, -3.4, -1 + Math.random() * 1.5);
    scene.add(m);
    rockets.push({ mesh: m, targetY: ty, speed: 3.4 + Math.random() * 1.2 });
  }

  function worldFromEvent(ev) {
    var v = new THREE.Vector3(
      (ev.clientX / window.innerWidth) * 2 - 1,
      -(ev.clientY / window.innerHeight) * 2 + 1,
      0.5
    );
    v.unproject(camera);
    var dir = v.sub(camera.position).normalize();
    var t = -camera.position.z / dir.z;
    var p = camera.position.clone().add(dir.multiplyScalar(t));
    return { x: Math.max(-4.2, Math.min(4.2, p.x)), y: Math.max(0.6, Math.min(4.2, p.y)) };
  }

  var EGG_Z = -1.2;
  var EGGS_WIDE = [[-3.05, 2.9], [0.3, 3.25], [4.55, 0.4], [0.7, -2.55], [-3.05, -1.7], [2.7, 2.55]];
  var EGGS_NARROW = [[0, 3.3], [-1.5, 2.95], [1.5, 3.05], [-1.35, -1.7], [1.35, -2.1], [0, -2.5]];

  function starTexture() {
    var c = document.createElement("canvas");
    c.width = c.height = 96;
    var g = c.getContext("2d");
    g.translate(48, 50);
    g.shadowColor = "rgba(232,201,137,0.9)";
    g.shadowBlur = 14;
    g.fillStyle = "#ffe9b8";
    g.beginPath();
    for (var k = 0; k < 10; k++) {
      var rad = k % 2 ? 14 : 34;
      var a = -Math.PI / 2 + k * Math.PI / 5;
      var x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (k) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.closePath();
    g.fill();
    return new THREE.CanvasTexture(c);
  }
  var eggTex = starTexture();
  var eggs = [];
  var eggFound = [];
  try {
    eggFound = JSON.parse(window.localStorage.getItem("cumhuriyet-eggs") || "[]") || [];
  } catch (e) { eggFound = []; }
  for (var ei = 0; ei < QUOTES.length; ei++) {
    var egg = new THREE.Sprite(new THREE.SpriteMaterial({
      map: eggTex, color: 0xfff3d0, transparent: true, opacity: 0.9, depthWrite: false
    }));
    egg.position.set(EGGS_WIDE[ei][0], EGGS_WIDE[ei][1], EGG_Z);
    scene.add(egg);
    eggs.push(egg);
  }
  function layoutEggs() {
    var pts = camera.aspect < 1 ? EGGS_NARROW : EGGS_WIDE;
    for (var i = 0; i < eggs.length; i++) eggs[i].position.set(pts[i][0], pts[i][1], EGG_Z);
  }
  function eggCountText() {
    var n = eggFound.filter(Boolean).length;
    document.getElementById("eggcount").textContent = n + "/" + eggs.length + " söz";
  }
  eggCountText();

  var quoteTimer = 0;
  function showQuote(q) {
    var box = document.getElementById("quotebox");
    var words = q.t.split(" ").map(function (w, i) {
      return '<span style="--d:' + (i * 0.11).toFixed(2) + 's">' + w + "</span>";
    }).join(" ");
    box.innerHTML = '<p class="q">' + words + '</p><p class="m"><span>&#9733;</span> ' + q.m + " · Mustafa Kemal Atatürk</p>";
    box.classList.add("show");
    window.clearTimeout(quoteTimer);
    quoteTimer = window.setTimeout(function () { box.classList.remove("show"); }, 7000);
  }

  var celebrated = eggFound.filter(Boolean).length === QUOTES.length;
  function findEgg(i) {
    var first = !eggFound[i];
    eggFound[i] = true;
    if (first) {
      try { window.localStorage.setItem("cumhuriyet-eggs", JSON.stringify(eggFound)); } catch (e) {}
      eggCountText();
      var p = eggs[i].position;
      explode(p.x, p.y, p.z, [0xe8c989, 0xffd27a, 0xfff3d0]);
    }
    showQuote(QUOTES[i]);
    if (!celebrated && eggFound.filter(Boolean).length === QUOTES.length) {
      celebrated = true;
      showQuote(FINALE);
      for (var k = 0; k < 6; k++) window.setTimeout(launch, 300 + k * 260);
    }
  }

  // ---- input ----
  window.addEventListener("pointerdown", function (ev) {
    if (musicPref && !musicOn) startMusic(); // resume preferred music on first gesture
    var px = ev.clientX, py = ev.clientY;
    var best = -1, bestD = 34; // px radius in which a click lands on an egg
    var v = new THREE.Vector3();
    for (var i = 0; i < eggs.length; i++) {
      v.copy(eggs[i].position).project(camera);
      var sx = (v.x + 1) / 2 * window.innerWidth;
      var sy = (-v.y + 1) / 2 * window.innerHeight;
      var d = Math.hypot(sx - px, sy - py);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) { findEgg(best); return; }
    var w = worldFromEvent(ev);
    launch(w.x, w.y);
  });
  window.addEventListener("keydown", function (ev) {
    if (ev.code === "Space" || ev.code === "Enter") {
      ev.preventDefault();
      launch();
      canvas.focus();
    }
  });

  // ---- Cumhuriyet playlist (band + orchestra recordings, normalized -18 LUFS) ----
  var PLAYLIST = [
    { src: "izmir-marsi-orchestra.m4a", t: "İzmir Marşı · TSK Armoni Mızıkası" },
    { src: "izmir-marsi-crr.m4a", t: "İzmir Marşı · CRR Senfoni Orkestrası ve Korosu" },
    { src: "onuncu-yil-tsk.m4a", t: "Onuncu Yıl Marşı · TSK Armoni Mızıkası" },
    { src: "onuncu-yil-cso.m4a", t: "Onuncu Yıl Marşı · Cumhurbaşkanlığı Senfoni Orkestrası" }
  ];
  var musicBtn = document.getElementById("musicbtn");
  var prevBtn = document.getElementById("prevbtn");
  var nextBtn = document.getElementById("nextbtn");
  var song = new Audio();
  song.preload = "auto";
  song.volume = 0.7;
  var musicOn = false, musicPref = false, trackIdx = 0;
  try {
    musicPref = window.localStorage.getItem("cumhuriyet-music") === "1";
    trackIdx = parseInt(window.localStorage.getItem("cumhuriyet-track") || "0", 10) || 0;
  } catch (e) {}
  if (!(trackIdx >= 0 && trackIdx < PLAYLIST.length)) trackIdx = 0;
  function trackLabel() {
    musicBtn.innerHTML = "&#9834;&nbsp; " + (trackIdx + 1) + "/" + PLAYLIST.length;
    musicBtn.title = PLAYLIST[trackIdx].t;
  }
  function loadTrack(i, keepPlaying) {
    trackIdx = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
    var wasOn = musicOn || keepPlaying;
    song.src = PLAYLIST[trackIdx].src;
    if (wasOn) {
      var pr = song.play();
      if (pr && pr.catch) pr.catch(function () {});
    }
    try { window.localStorage.setItem("cumhuriyet-track", String(trackIdx)); } catch (e) {}
    trackLabel();
  }
  function startMusic() {
    if (musicOn) return;
    if (!song.src) song.src = PLAYLIST[trackIdx].src;
    var pr = song.play();
    if (pr && pr.catch) pr.catch(function () { musicOn = false; musicBtn.setAttribute("aria-pressed", "false"); });
    musicOn = true;
    musicBtn.setAttribute("aria-pressed", "true");
  }
  function stopMusic() {
    musicOn = false;
    song.pause();
    musicBtn.setAttribute("aria-pressed", "false");
  }
  musicBtn.addEventListener("click", function () {
    if (musicOn) { musicPref = false; stopMusic(); }
    else { musicPref = true; startMusic(); }
    try { window.localStorage.setItem("cumhuriyet-music", musicPref ? "1" : "0"); } catch (e) {}
  });
  prevBtn.addEventListener("click", function () { loadTrack(trackIdx - 1, musicOn); });
  nextBtn.addEventListener("click", function () { loadTrack(trackIdx + 1, musicOn); });
  song.addEventListener("ended", function () { loadTrack(trackIdx + 1, true); }); // loop the playlist
  trackLabel();

  // ---- resize ----
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    fitAtaturk();
    layoutEggs();
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- loop ----
  var clock = new THREE.Clock();
  var spin = 0;

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    if (!reduced) {
      var posAttr = flagGeo.attributes.position;
      for (var v = 0; v < posAttr.count; v++) {
        var bx = flagBase[v * 3], by = flagBase[v * 3 + 1];
        var env = (bx + 2.25) / 4.5; // pinned at the hoist, freest at the fly
        posAttr.array[v * 3 + 2] =
          Math.sin(bx * 1.1 + t * 2.6) * 0.34 * env +
          Math.sin(bx * 2.3 - t * 1.7) * 0.13 * env +
          Math.sin(by * 2.0 + t * 1.1) * 0.07 * env;
      }
      posAttr.needsUpdate = true;
      flagGeo.computeVertexNormals();
      flag.rotation.y = -0.16 + Math.sin(t * 0.4) * 0.09;
      stars.rotation.y = t * 0.006;
      for (var e = 0; e < eggs.length; e++) {
        var em = eggs[e].material;
        if (eggFound[e]) { em.opacity = 0.4; eggs[e].scale.setScalar(0.24); }
        else {
          em.opacity = 0.72 + Math.sin(t * 2.1 + e * 1.7) * 0.22;
          eggs[e].scale.setScalar(0.3 + Math.sin(t * 1.6 + e * 2.3) * 0.05);
        }
      }
    }

    // timed launches
    nextLaunch -= dt;
    if (nextLaunch <= 0) {
      launch();
      if (Math.random() < 0.3) launch();
      nextLaunch = reduced ? 2.8 : 1.1 + Math.random() * 0.9;
    }

    // rockets rise, burst at apex
    for (var i = rockets.length - 1; i >= 0; i--) {
      var rk = rockets[i];
      rk.mesh.position.y += rk.speed * dt;
      rk.mesh.position.x += Math.sin(t * 6 + i) * 0.15 * dt;
      if (rk.mesh.position.y >= rk.targetY) {
        explode(rk.mesh.position.x, rk.targetY, rk.mesh.position.z);
        scene.remove(rk.mesh);
        rk.mesh.geometry.dispose();
        rk.mesh.material.dispose();
        rockets.splice(i, 1);
      }
    }

    // burst physics
    for (var b = bursts.length - 1; b >= 0; b--) {
      var bu = bursts[b];
      bu.life += dt;
      var attr = bu.pts.geometry.attributes.position;
      var arr = attr.array;
      var drag = 1 - 1.5 * dt;
      for (var p = 0; p < bu.vel.length; p++) {
        var v = bu.vel[p];
        v.multiplyScalar(drag);
        v.y -= 0.9 * dt;
        arr[p * 3] += v.x * dt;
        arr[p * 3 + 1] += v.y * dt;
        arr[p * 3 + 2] += v.z * dt;
      }
      attr.needsUpdate = true;
      var fade = 1 - bu.life / bu.ttl;
      bu.pts.material.opacity = Math.max(0, fade);
      if (bu.life >= bu.ttl) {
        scene.remove(bu.pts);
        bu.pts.geometry.dispose();
        bu.pts.material.dispose();
        bursts.splice(b, 1);
      }
    }

    renderer.render(scene, camera);
  }
  tick();
})();
</script>
